# actionlint configuration.
#
# The google-github-actions/run-gemini-cli action moves quickly and actionlint's
# bundled action metadata lags behind. As of v0 (commit f77273f) the action
# defines `github_pr_number` and `github_issue_number` inputs, but actionlint's
# cached metadata predates them, causing false "input is not defined" errors on
# the vendored Gemini workflows. Ignore only those specific stale-metadata
# errors; everything else on these files is still linted.
paths:
  .github/workflows/gemini-*.yml:
    ignore:
      - 'input "github_(issue|pr)_number" is not defined in action "google-github-actions/run-gemini-cli@v0"'
