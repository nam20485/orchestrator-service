name: Droid Wiki Refresh

on:
  push:
    branches: [development]

jobs:
  wiki-refresh:
    # Least-privilege scope for `GITHUB_TOKEN`: checkout needs `contents: read`,
    # and committing the refreshed wiki back to the branch needs `contents: write`.
    # The token is explicitly scoped (rather than relying on the repo default) so
    # it never carries more than this workflow requires.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Direct pinned download instead of `curl ... | sh`: the vendor install
      # script is fetched fresh on every run, but this job holds
      # `contents: write` and pushes to the branch — the executed code must be
      # immutable and reviewable. Version and sha256 are pinned here; version
      # bumps are deliberate PRs. (Checksum independently verified against the
      # vendor-published .sha256 at pin time.)
      - name: Install Factory Droid (pinned)
        run: |
          DROID_VERSION='0.213.0'
          DROID_SHA256='6f4cf5c65238be359c21a60c75dbbe31c90ffa6c860ed45fcc10e7fbae3250ff'
          install_dir="$HOME/.local/bin"
          mkdir -p "$install_dir"
          curl -fsSL -o "$install_dir/droid" \
            "https://downloads.factory.ai/factory-cli/releases/${DROID_VERSION}/linux/x64/droid"
          echo "${DROID_SHA256}  $install_dir/droid" | sha256sum --check --strict -
          chmod +x "$install_dir/droid"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Generate wiki
        run: droid exec --auto high "/wiki"
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}

      # Persist the regenerated `droid-wiki/` docs back to the branch so the
      # committed wiki stays in sync with the code. Commits pushed by the default
      # `GITHUB_TOKEN` do not re-trigger `push` workflows, so there is no loop.
      - name: Commit refreshed wiki
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add droid-wiki/
          if git diff --cached --quiet; then
            echo "No wiki changes to commit."
            exit 0
          fi
          git commit -m "docs(wiki): auto-refresh droid-wiki"
          git push
