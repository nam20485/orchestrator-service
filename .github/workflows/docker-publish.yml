name: Docker

on:
  push:
    branches: [ "main", "development" ]
    tags: [ 'v*.*.*' ]
    # Path filters only affect branch pushes (tag pushes always run per GitHub
    # Actions semantics). Skip the whole pipeline when no image-relevant file
    # changed (e.g. docs, tests, .idea).
    paths:
      - 'Dockerfile'
      - 'Dockerfile.webhook'
      - 'Dockerfile.beads'
      - 'deploy/caddy/**'
      - 'image/**'
      - 'scripts/docker-entrypoint.sh'
      - 'scripts/prompt.ps1'
      - 'webhook_receiver/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'README.md'
      - '.github/workflows/docker-publish.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Published beads builder image. Downstream images override their local
  # `rust-builder` stage with this image (see build-contexts) so Rust is
  # compiled exactly once, in the beads-builder job below.
  BEADS_IMAGE: ghcr.io/${{ github.repository }}/beads

permissions:
  contents: read

jobs:
  # --- Compile Rust (br + bvr) once and publish the builder image ---
  beads-builder:
    name: Build & publish beads builder
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.2.4'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Branch Name
        env:
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          echo "BRANCH_NAME=${REF_NAME}" >> "$GITHUB_ENV"
          echo "COMMIT_SHA=${SHA}" >> "$GITHUB_ENV"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.BEADS_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.BRANCH_NAME }}-${{ github.run_number }}
            type=raw,value=${{ env.BRANCH_NAME }}-latest

      - name: Build and push beads builder image
        id: build-and-push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile.beads
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=beads-builder
          cache-to: type=gha,mode=max,scope=beads-builder
          platforms: linux/amd64

      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@"${DIGEST}"

  # --- Build the runtime images (Rust stage overridden by the published image) ---
  build:
    name: Publish ${{ matrix.name }}
    needs: beads-builder
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: orchestrator-service
            dockerfile: ./Dockerfile
            context: .
            image_suffix: ""
          - name: orchestrator-webhook
            dockerfile: ./Dockerfile.webhook
            context: .
            image_suffix: /webhook
          - name: orchestrator-caddy
            dockerfile: ./deploy/caddy/Dockerfile
            context: ./deploy/caddy
            image_suffix: /caddy

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.2.4'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Branch Name
        env:
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          echo "BRANCH_NAME=${REF_NAME}" >> "$GITHUB_ENV"
          echo "COMMIT_SHA=${SHA}" >> "$GITHUB_ENV"

      - name: Echo Environment Variables
        run: |
          echo "BRANCH_NAME: ${{ env.BRANCH_NAME }}"
          echo "COMMIT_SHA: ${{ env.COMMIT_SHA }}"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image_suffix }}
          tags: |
            type=raw,value=${{ env.BRANCH_NAME }}-${{ github.run_number }}
            type=raw,value=${{ env.BRANCH_NAME }}-latest

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Override the self-contained `rust-builder` stage with the published
          # beads builder image so Rust is NOT recompiled here. Harmless for
          # caddy (no rust-builder stage → context is unused).
          build-contexts: |
            rust-builder=docker-image://${{ env.BEADS_IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          platforms: linux/amd64

      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@"${DIGEST}"
