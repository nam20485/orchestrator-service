name: validate

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v8.1.0
        with:
          enable-cache: true

      - name: Install actionlint
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash
          sudo mv actionlint /usr/local/bin/

      - name: Install shellcheck and jq
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq

      - name: Lint
        run: pwsh -NoProfile -File ./scripts/validate.ps1 -Lint

  scan:
    name: scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Secret scan
        run: pwsh -NoProfile -File ./scripts/validate.ps1 -Scan

  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v8.1.0
        with:
          enable-cache: true

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.0.0 -Scope AllUsers -Force -AllowClobber

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Test
        run: pwsh -NoProfile -File ./scripts/validate.ps1 -Test

  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build orchestratorservice image
        run: docker build -f Dockerfile -t orchestratorservice:ci .

      - name: Build webhook receiver image
        run: docker build -f Dockerfile.webhook -t orchestrator-webhook:ci .
