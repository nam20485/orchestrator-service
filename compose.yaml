services:
  orchestratorservice:
    image: orchestratorservice
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "4099:4099"
    volumes:
      - opencode-memory:/app/.memory
      - opencode-workspace:/workspace
    environment:
      - ZAI_CODING_API_KEY
      - ZHIPUAI_CODING_API_KEY
      - OPENROUTER_API_KEY
      - ALIBABA_API_KEY
      - GH_ORCHESTRATION_AGENT_TOKEN
      - GITHUB_TOKEN
      - OPENCODE_SERVER_PASSWORD

volumes:
  opencode-memory:
  opencode-workspace:
