[project]
name = "orchestrator-service"
version = "0.1.0"
description = "OpenCode orchestration server with GitHub webhook receiver"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.3",
    "jinja2>=3.1",
    "uvicorn[standard]>=0.48.0",
]

[project.scripts]
orchestrator-webhook = "webhook_receiver.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-xdist>=3.6",
    "httpx>=0.27",
    "ruff>=0.9",
    "pre-commit>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["webhook_receiver"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# Ratchet exemptions for pre-existing complexity above the max-complexity=15
# threshold; tracked as deferred refactors in docs/agent-readiness-action-plan.md.
"webhook_receiver/dashboard.py" = ["C901"]  # create_dashboard_router: 37
"webhook_receiver/runner.py" = ["C901"]     # _run_completion_watcher: 22

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=webhook_receiver --cov-report=term-missing --cov-report=html:htmlcov"

[tool.coverage.run]
source = ["webhook_receiver"]
omit = [
    "webhook_receiver/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
