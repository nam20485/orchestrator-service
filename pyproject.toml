[project]
name = "orchestrator-service"
version = "0.1.0"
description = "OpenCode orchestration server with GitHub webhook receiver"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.3",
    "jinja2>=3.1",
    "uvicorn[standard]>=0.48.0",
]

[project.scripts]
orchestrator-webhook = "webhook_receiver.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "httpx>=0.27",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["webhook_receiver"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["webhook_receiver"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
