<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orchestration Dashboard</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --surface2: #1e293b;
      --border: #2d3a4d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #388bfd;
      --warn-bg: #3d2a00;
      --warn-border: #9e6a03;
      --warn-text: #f0c14b;
      --ok: #3fb950;
      --err: #f85149;
      --ready: #3fb950;
      --blocked: #f0c14b;
      --active: #388bfd;
      --closed: #6e7681;
      --halted: #f85149;
      --open: #e6edf3;
      --mono: ui-monospace, "Cascadia Code", "SF Mono", monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .topbar h1 { font-size: 1.2rem; margin: 0; }
    .topbar .right { display: flex; align-items: center; gap: 1rem; font-size: 0.85rem; color: var(--muted); }
    .loop-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      margin-right: 4px;
    }
    .loop-dot.running { background: var(--ok); animation: pulse 2s infinite; }
    .loop-dot.stopped { background: var(--err); }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }

    .summary {
      display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 0.75rem 1.25rem; min-width: 90px;
      text-align: center;
    }
    .stat-card .num { font-size: 1.6rem; font-weight: 700; line-height: 1.2; }
    .stat-card .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; }
    .stat-card.ready .num { color: var(--ready); }
    .stat-card.blocked .num { color: var(--blocked); }
    .stat-card.active .num { color: var(--active); }
    .stat-card.closed .num { color: var(--closed); }
    .stat-card.halted .num { color: var(--halted); }
    .stat-card.total .num { color: var(--text); }

    .grid { display: grid; gap: 1.5rem; grid-template-columns: 1fr 340px; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

    .panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; overflow: hidden;
    }
    .panel-header {
      padding: 0.6rem 1rem; border-bottom: 1px solid var(--border);
      font-size: 0.85rem; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.04em;
      display: flex; justify-content: space-between; align-items: center;
    }
    .panel-header .count {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 4px; padding: 0.1rem 0.5rem; font-size: 0.8rem; color: var(--text);
    }

    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    thead th {
      text-align: left; padding: 0.5rem 0.75rem; color: var(--muted);
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.03em;
      border-bottom: 1px solid var(--border); cursor: pointer; user-select: none;
      white-space: nowrap;
    }
    thead th:hover { color: var(--text); }
    thead th.sorted { color: var(--accent); }
    tbody tr { border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.1s; }
    tbody tr:hover { background: var(--surface2); }
    tbody td { padding: 0.5rem 0.75rem; vertical-align: top; }

    .badge {
      display: inline-block; padding: 0.15rem 0.55rem; border-radius: 4px;
      font-size: 0.72rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.03em; white-space: nowrap;
    }
    .badge.ready { background: rgba(63,185,80,0.15); color: var(--ready); }
    .badge.blocked { background: rgba(240,193,75,0.15); color: var(--blocked); }
    .badge.active { background: rgba(56,139,253,0.15); color: var(--active); animation: pulse 2s infinite; }
    .badge.closed { background: rgba(110,118,129,0.15); color: var(--closed); }
    .badge.halted { background: rgba(248,81,73,0.15); color: var(--halted); }
    .badge.open { background: rgba(230,237,243,0.1); color: var(--open); }

    .id-cell { font-family: var(--mono); font-size: 0.82rem; }
    .empty-msg { padding: 2rem 1rem; text-align: center; color: var(--muted); font-size: 0.9rem; }

    .active-list { list-style: none; margin: 0; padding: 0; }
    .active-item {
      padding: 0.6rem 1rem; border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
    }
    .active-item:last-child { border-bottom: none; }
    .active-item .title { font-weight: 600; margin-bottom: 0.15rem; }
    .active-item .meta { color: var(--muted); font-size: 0.78rem; display: flex; gap: 0.75rem; }
    .active-item .elapsed { color: var(--accent); font-family: var(--mono); }

    .timeline { max-height: 400px; overflow-y: auto; }
    .event-item {
      padding: 0.45rem 1rem; border-bottom: 1px solid var(--border);
      font-size: 0.8rem; display: flex; gap: 0.5rem; align-items: baseline;
    }
    .event-item:last-child { border-bottom: none; }
    .event-time { color: var(--muted); font-family: var(--mono); font-size: 0.72rem; white-space: nowrap; min-width: 60px; }
    .event-type {
      font-size: 0.7rem; font-weight: 600; padding: 0.1rem 0.4rem;
      border-radius: 3px; text-transform: uppercase; white-space: nowrap;
    }
    .event-type.bead { background: rgba(56,139,253,0.15); color: var(--accent); }
    .event-type.agent { background: rgba(56,139,253,0.15); color: var(--accent); }
    .event-type.webhook { background: rgba(63,185,80,0.15); color: var(--ok); }
    .event-type.dispatch { background: rgba(63,185,80,0.15); color: var(--ok); }
    .event-type.bead_failed { background: rgba(248,81,73,0.15); color: var(--err); }
    .event-type.bead_halted { background: rgba(248,81,73,0.15); color: var(--err); }
    .event-detail { color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    button {
      background: var(--accent); color: #fff; border: none; border-radius: 4px;
      padding: 0.3rem 0.75rem; font-size: 0.8rem; cursor: pointer;
    }
    button:hover { filter: brightness(1.1); }
    button.secondary { background: var(--surface2); border: 1px solid var(--border); }
    .refresh-on { font-size: 0.72rem; color: var(--ok); }

    .sse-status { font-size: 0.72rem; }
    .sse-status.connected { color: var(--ok); }
    .sse-status.disconnected { color: var(--err); }

    .refresh-bar { height: 3px; background: var(--surface2); overflow: hidden; }
    .refresh-bar-fill { height: 100%; width: 0%; background: var(--accent); transition: width 0.1s linear; }
    .refresh-countdown { color: var(--muted); font-family: var(--mono); font-size: 0.72rem; white-space: nowrap; }
    .settings-btn { background: var(--surface2); border: 1px solid var(--border); padding: 0.25rem 0.7rem; font-size: 0.8rem; color: var(--text); }
    .settings-btn:hover { filter: brightness(1.1); }
    .settings-btn.open { border-color: var(--accent); color: var(--accent); }
    .settings-panel {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 0.6rem 1.5rem; display: flex; align-items: center; gap: 0.75rem;
      font-size: 0.85rem; flex-wrap: wrap;
    }
    .settings-panel.hidden { display: none; }
    .settings-panel label { color: var(--muted); }
    .settings-panel input[type=number] {
      width: 72px; background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 4px; padding: 0.25rem 0.4rem; font-size: 0.85rem; font-family: var(--mono);
    }
    .refresh-feedback { font-size: 0.75rem; }

    /* ── View selector + Graph + Pages panes ─────────────────────────────── */
    .view-bar { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .view-opt {
      flex: 1 1 220px; display: flex; align-items: flex-start; gap: 0.5rem;
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 0.6rem 0.8rem; cursor: pointer; transition: border-color 0.12s, background 0.12s;
    }
    .view-opt:hover { border-color: var(--accent); }
    .view-opt input { margin-top: 0.25rem; accent-color: var(--accent); }
    .view-opt .vo-title { font-weight: 600; font-size: 0.9rem; color: var(--text); }
    .view-opt .vo-desc { font-size: 0.75rem; color: var(--muted); }
    .view-opt.active { border-color: var(--accent); background: var(--surface2); }

    .view-pane { display: none; }
    .view-pane.active { display: block; }

    .graph-wrap {
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      position: relative; height: calc(100vh - 220px); min-height: 440px; overflow: hidden;
    }
    .graph-controls {
      position: absolute; top: 0.5rem; right: 0.5rem; display: flex; gap: 0.3rem; z-index: 5;
    }
    .graph-controls button { padding: 0.2rem 0.6rem; }
    .graph-status { position: absolute; top: 0.6rem; left: 0.8rem; font-size: 0.75rem; color: var(--muted); z-index: 5; }
    .graph-legend {
      position: absolute; bottom: 0.5rem; left: 0.5rem; display: flex; gap: 0.7rem; flex-wrap: wrap;
      background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 6px;
      padding: 0.3rem 0.6rem; font-size: 0.72rem; z-index: 5;
    }
    .graph-legend .key { display: inline-flex; align-items: center; gap: 0.3rem; color: var(--muted); }
    .graph-legend .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
    .graph-empty {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 0.95rem; pointer-events: none;
    }
    #graphSvg { width: 100%; height: 100%; display: block; background: #0d1117; cursor: grab; }
    #graphSvg:active { cursor: grabbing; }
    .gnode:hover rect { filter: brightness(1.25); }

    .pages-wrap {
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      overflow: hidden; height: calc(100vh - 220px); min-height: 440px; display: flex; flex-direction: column;
    }
    .pages-bar {
      padding: 0.5rem 0.8rem; border-bottom: 1px solid var(--border); display: flex; gap: 0.6rem;
      align-items: center; font-size: 0.82rem; color: var(--muted);
    }
    .pages-frame { flex: 1; border: 0; background: #0d1117; width: 100%; }
  </style>
</head>
<body>

<div class="topbar">
  <h1>Orchestration Dashboard</h1>
  <div class="right">
    <span><span id="loopDot" class="loop-dot stopped"></span><span id="loopText">Loop: stopped</span></span>
    <span id="sseStatus" class="sse-status disconnected">SSE: disconnected</span>
    <span id="refreshCountdown" class="refresh-countdown"></span>
    <span id="clock"></span>
    <button id="settingsBtn" class="settings-btn">Settings</button>
  </div>
</div>

<div id="settingsPanel" class="settings-panel hidden">
  <label><input type="checkbox" id="autoRefresh"> Auto-refresh</label>
  <label for="refreshInput">Refresh interval (s):</label>
  <input type="number" id="refreshInput" min="1" step="1" value="5">
  <button id="applyRefresh">Apply</button>
  <button id="manualRefresh" class="secondary">Refresh now</button>
  <span id="refreshFeedback" class="refresh-feedback"></span>
</div>

<div class="refresh-bar"><div id="refreshBarFill" class="refresh-bar-fill"></div></div>

<div class="container">
  <!-- View selector -->
  <div class="view-bar" id="viewBar">
    <label class="view-opt" data-view="list">
      <input type="radio" name="viewType" value="list">
      <span><span class="vo-title">List</span><br><span class="vo-desc">Bead queue with live status</span></span>
    </label>
    <label class="view-opt" data-view="graph">
      <input type="radio" name="viewType" value="graph">
      <span><span class="vo-title">Graph</span><br><span class="vo-desc">Dependency DAG (interactive)</span></span>
    </label>
    <label class="view-opt" data-view="pages">
      <input type="radio" name="viewType" value="pages">
      <span><span class="vo-title">bvr Pages</span><br><span class="vo-desc">Full static site from bvr</span></span>
    </label>
  </div>

  <div id="listPane" class="view-pane active">
  <!-- Summary cards -->
  <div class="summary" id="summaryCards"></div>

  <div class="grid">
    <!-- Left column: bead table -->
    <div>
      <div class="panel">
        <div class="panel-header">
          <span>Beads</span>
          <span class="count" id="beadCount">0</span>
        </div>
        <table id="beadTable">
          <thead>
            <tr>
              <th data-col="ui_status">Status</th>
              <th data-col="id">ID</th>
              <th data-col="title">Title</th>
              <th data-col="type">Type</th>
              <th data-col="priority">Pri</th>
              <th data-col="retry_count">Retries</th>
              <th data-col="elapsed_s">Elapsed</th>
            </tr>
          </thead>
          <tbody id="beadBody"></tbody>
        </table>
      </div>
    </div>

    <!-- Right column: active agents + event timeline -->
    <div style="display: flex; flex-direction: column; gap: 1.5rem;">
      <div class="panel">
        <div class="panel-header">
          <span>Active Agents</span>
          <span class="count" id="activeCount">0</span>
        </div>
        <ul class="active-list" id="activeList"></ul>
      </div>

      <div class="panel">
        <div class="panel-header">
          <span>Event Timeline</span>
          <span class="count" id="eventCount">0</span>
        </div>
        <div class="timeline" id="timeline"></div>
      </div>
    </div>
  </div>
  </div><!-- /listPane -->

  <!-- Graph view -->
  <div id="graphPane" class="view-pane">
    <div class="graph-wrap">
      <div class="graph-status" id="graphStatus">Loading…</div>
      <div class="graph-controls">
        <button id="graphZoomIn" title="Zoom in">+</button>
        <button id="graphZoomOut" title="Zoom out">−</button>
        <button id="graphReset" class="secondary" title="Reset view">Reset</button>
      </div>
      <div class="graph-empty" id="graphEmpty" style="display:none">No beads yet. Run /plan-to-beads to create the DAG.</div>
      <svg id="graphSvg" xmlns="http://www.w3.org/2000/svg"><g id="graphRoot"></g></svg>
      <div class="graph-legend" id="graphLegend"></div>
    </div>
  </div>

  <!-- bvr Pages view -->
  <div id="pagesPane" class="view-pane">
    <div class="pages-wrap">
      <div class="pages-bar">
        <span>bvr static pages</span>
        <button id="pagesRegen" class="secondary">Regenerate</button>
        <span id="pagesStatus"></span>
      </div>
      <iframe class="pages-frame" id="pagesFrame" title="bvr pages"></iframe>
    </div>
  </div>
</div>

<script>
const API = '/api/dashboard';
let beadData = [];
let sortCol = 'ui_status';
let sortAsc = true;
let eventBuffer = [];
const MAX_EVENTS = 200;

// ── Clock ──────────────────────────────────────────────────────────────────
function tick() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString();
}
setInterval(tick, 1000); tick();

// ── Overview ───────────────────────────────────────────────────────────────
async function fetchOverview() {
  try {
    const r = await fetch(`${API}/overview`);
    const d = await r.json();
    const c = d.counts;
    const cards = [
      ['total',   'Total',   c.total],
      ['ready',   'Ready',   c.ready],
      ['blocked', 'Blocked', c.blocked],
      ['active',  'Active',  c.active],
      ['closed',  'Closed',  c.closed],
      ['halted',  'Halted',  c.halted],
    ];
    document.getElementById('summaryCards').innerHTML = cards.map(([cls, label, num]) =>
      `<div class="stat-card ${cls}"><div class="num">${num}</div><div class="label">${label}</div></div>`
    ).join('');

    const running = d.loop_status.running;
    const dot = document.getElementById('loopDot');
    dot.className = 'loop-dot ' + (running ? 'running' : 'stopped');
    document.getElementById('loopText').textContent =
      `Loop: ${running ? 'running' : 'stopped'} (${d.loop_status.poll_interval}s)`;
  } catch (e) { /* ignore transient fetch errors */ }
}

// ── Beads table ────────────────────────────────────────────────────────────
async function fetchBeads() {
  try {
    const r = await fetch(`${API}/beads`);
    beadData = await r.json();
    document.getElementById('beadCount').textContent = beadData.length;
    renderBeads();
  } catch (e) { /* ignore */ }
}

function renderBeads() {
  const tbody = document.getElementById('beadBody');
  if (!beadData.length) {
    tbody.innerHTML = '<tr><td colspan="7"><div class="empty-msg">No beads found. Run /plan-to-beads to create the DAG.</div></td></tr>';
    return;
  }

  // Sort
  beadData.sort((a, b) => {
    let va = a[sortCol], vb = b[sortCol];
    if (va == null) va = '';
    if (vb == null) vb = '';
    if (typeof va === 'number' && typeof vb === 'number') return sortAsc ? va - vb : vb - va;
    return sortAsc ? String(va).localeCompare(String(vb)) : String(vb).localeCompare(String(va));
  });

  let html = '';
  for (const b of beadData) {
    html += `<tr data-bead-id="${esc(b.id)}" title="Open detail in a new tab">`;
    html += `<td><span class="badge ${esc(b.ui_status)}">${esc(b.ui_status)}</span></td>`;
    html += `<td class="id-cell">${esc(b.id)}</td>`;
    html += `<td>${esc(b.title)}</td>`;
    html += `<td>${esc(b.type || '')}</td>`;
    html += `<td>${esc(String(b.priority))}</td>`;
    html += `<td>${b.retry_count > 0 ? esc(String(b.retry_count)) : ''}</td>`;
    html += `<td>${b.elapsed_s != null ? esc(String(b.elapsed_s)) + 's' : ''}</td>`;
    html += '</tr>';
  }
  tbody.innerHTML = html;

  // Attach click handlers (avoid inline onclick for XSS safety)
  tbody.querySelectorAll('tr[data-bead-id]').forEach(tr => {
    tr.addEventListener('click', () => toggleBead(tr.dataset.beadId));
  });

  // Update sort indicators
  document.querySelectorAll('thead th').forEach(th => {
    th.classList.toggle('sorted', th.dataset.col === sortCol);
  });
}

function toggleBead(id) {
  // Open a full detail page in a new tab. The detail page is isolated from
  // this page's 5s + SSE refresh, so reading stdout/stderr is not disrupted.
  window.open('/dashboard/bead/' + encodeURIComponent(id), '_blank');
}

// ── Active agents ──────────────────────────────────────────────────────────
async function fetchActive() {
  try {
    const r = await fetch(`${API}/active`);
    const list = await r.json();
    document.getElementById('activeCount').textContent = list.length;
    const el = document.getElementById('activeList');
    if (!list.length) {
      el.innerHTML = '<li class="active-item" style="color:var(--muted)">No active agents.</li>';
      return;
    }
    el.innerHTML = list.map(a => `
      <li class="active-item">
        <div class="title">${esc(a.title)} <span class="id-cell" style="color:var(--muted)">(${esc(a.bead_id)})</span></div>
        <div class="meta">
          <span>attempt ${a.retry_count + 1}</span>
          ${a.elapsed_s != null ? `<span class="elapsed">${a.elapsed_s}s</span>` : ''}
        </div>
      </li>
    `).join('');
  } catch (e) { /* ignore */ }
}

// ── Events ─────────────────────────────────────────────────────────────────
async function fetchEvents() {
  try {
    const r = await fetch(`${API}/events?limit=50`);
    const events = await r.json();
    eventBuffer = events.reverse();
    renderEvents();
  } catch (e) { /* ignore */ }
}

function renderEvents() {
  const el = document.getElementById('timeline');
  document.getElementById('eventCount').textContent = eventBuffer.length;
  if (!eventBuffer.length) {
    el.innerHTML = '<div class="empty-msg">No events yet.</div>';
    return;
  }
  el.innerHTML = eventBuffer.slice(0, 100).map(formatEvent).join('');
}

function formatEvent(e) {
  const t = new Date(e.ts * 1000).toLocaleTimeString();
  const d = e.data || {};
  let detail = '';
  switch (e.type) {
    case 'bead_picked_up': detail = `${d.bead_id}: ${d.title || ''}`; break;
    case 'agent_spawned':  detail = `${d.bead_id} pid=${d.pid} attempt=${d.attempt}`; break;
    case 'agent_completed':detail = `${d.bead_id} exit=${d.exit_code} ${d.duration_s}s status=${d.status}`; break;
    case 'bead_closed':    detail = `${d.bead_id}`; break;
    case 'bead_failed':    detail = `${d.bead_id} attempt=${d.attempt}/${d.max_retries}`; break;
    case 'bead_halted':    detail = `${d.bead_id} (${d.reason})`; break;
    case 'webhook_received':detail = `${d.event}/${d.action || ''} → ${d.repo}`; break;
    case 'dispatch_started': detail = `${d.prompt_file} pid=${d.pid}`; break;
    case 'dispatch_completed': detail = `${d.prompt_file} exit=${d.exit_code}`; break;
    default: detail = JSON.stringify(d).slice(0, 80);
  }
  const cls = e.type.replace(/_/g, ' ').split(' ')[0];
  return `<div class="event-item">
    <span class="event-time">${t}</span>
    <span class="event-type ${e.type}">${e.type.replace(/_/g, ' ')}</span>
    <span class="event-detail">${esc(detail)}</span>
  </div>`;
}

function addEvent(e) {
  eventBuffer.unshift(e);
  if (eventBuffer.length > MAX_EVENTS) eventBuffer.pop();
  renderEvents();
}

// ── SSE ────────────────────────────────────────────────────────────────────
let evtSource = null;
function connectSSE() {
  if (evtSource) evtSource.close();
  evtSource = new EventSource(`${API}/events/stream`);
  const statusEl = document.getElementById('sseStatus');
  evtSource.onopen = () => { statusEl.textContent = 'SSE: connected'; statusEl.className = 'sse-status connected'; };
  evtSource.onerror = () => {
    statusEl.textContent = 'SSE: disconnected';
    statusEl.className = 'sse-status disconnected';
    evtSource.close();
    setTimeout(connectSSE, 3000);
  };
  evtSource.onmessage = (msg) => {
    try {
      const e = JSON.parse(msg.data);
      addEvent(e);
      // Refresh relevant panels on state-changing events
      if (['bead_picked_up', 'bead_closed', 'bead_failed', 'bead_halted', 'agent_completed'].includes(e.type)) {
        fetchOverview(); fetchBeads(); fetchActive();
      }
    } catch (err) { /* ignore parse errors on keepalive */ }
  };
}

// ── Helpers ────────────────────────────────────────────────────────────────
function esc(s) {
  const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML;
}

// ── Sorting ────────────────────────────────────────────────────────────────
document.querySelectorAll('thead th').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (sortCol === col) sortAsc = !sortAsc;
    else { sortCol = col; sortAsc = true; }
    renderBeads();
  });
});

// ── Refresh scheduling + progress ──────────────────────────────────────────
const REFRESH_DEFAULT = 5;
let refreshSec = Math.max(1, parseInt(localStorage.getItem('refreshSec'), 10) || REFRESH_DEFAULT);
let autoRefresh = localStorage.getItem('autoRefresh') !== '0'; // default on
let refreshTimer = null;
let cycleStart = 0;

function pollAll() {
  fetchOverview(); fetchBeads(); fetchActive();
  if (currentView === 'graph') fetchGraph().then(() => { if (currentView === 'graph') renderGraph(); });
}

function scheduleRefresh() {
  stopRefresh();
  if (!autoRefresh) { updateRefreshUI(); return; }
  cycleStart = Date.now();
  pollAll();
  refreshTimer = setTimeout(scheduleRefresh, refreshSec * 1000);
}

function stopRefresh() {
  if (refreshTimer) { clearTimeout(refreshTimer); refreshTimer = null; }
}

function startProgressBar() {
  setInterval(() => {
    const fill = document.getElementById('refreshBarFill');
    const cd = document.getElementById('refreshCountdown');
    if (!autoRefresh) {
      fill.style.width = '0%';
      cd.textContent = 'auto-refresh off';
      return;
    }
    const elapsed = (Date.now() - cycleStart) / 1000;
    const remaining = Math.max(0, refreshSec - elapsed);
    fill.style.width = Math.min(100, (elapsed / refreshSec) * 100) + '%';
    cd.textContent = 'refresh in ' + remaining.toFixed(0) + 's';
  }, 200);
}

// ── Settings ───────────────────────────────────────────────────────────────
function updateRefreshUI() {
  document.getElementById('autoRefresh').checked = autoRefresh;
  document.getElementById('refreshInput').value = refreshSec;
  document.getElementById('settingsBtn').classList.toggle('open',
    !document.getElementById('settingsPanel').classList.contains('hidden'));
}

document.getElementById('settingsBtn').addEventListener('click', () => {
  const panel = document.getElementById('settingsPanel');
  panel.classList.toggle('hidden');
  updateRefreshUI();
});

document.getElementById('applyRefresh').addEventListener('click', () => {
  const v = parseInt(document.getElementById('refreshInput').value, 10);
  const fb = document.getElementById('refreshFeedback');
  if (!Number.isFinite(v) || v < 1) {
    fb.textContent = 'must be >= 1s'; fb.style.color = 'var(--err)'; return;
  }
  refreshSec = v;
  localStorage.setItem('refreshSec', String(v));
  fb.textContent = 'saved'; fb.style.color = 'var(--ok)';
  if (autoRefresh) scheduleRefresh();
  setTimeout(() => { fb.textContent = ''; }, 1500);
});

document.getElementById('autoRefresh').addEventListener('change', (e) => {
  autoRefresh = e.target.checked;
  localStorage.setItem('autoRefresh', autoRefresh ? '1' : '0');
  if (autoRefresh) scheduleRefresh();
  else { stopRefresh(); document.getElementById('refreshFeedback').textContent = 'auto-refresh paused'; }
  setTimeout(() => { document.getElementById('refreshFeedback').textContent = ''; }, 1500);
});

document.getElementById('manualRefresh').addEventListener('click', () => {
  pollAll(); fetchEvents();
  const fb = document.getElementById('refreshFeedback');
  fb.textContent = 'refreshed'; fb.style.color = 'var(--ok)';
  setTimeout(() => { fb.textContent = ''; }, 1500);
});

// ── View selector + Graph + Pages ──────────────────────────────────────────
const VIEWS = ['list', 'graph', 'pages'];
const STATUS_COLOR = {
  active: '#388bfd', ready: '#3fb950', blocked: '#f0c14b',
  closed: '#6e7681', halted: '#f85149', open: '#e6edf3',
};
let currentView = VIEWS.includes(localStorage.getItem('dashboard.viewType'))
  ? localStorage.getItem('dashboard.viewType') : 'list';
let graphData = { nodes: [], edges: [], initialized: false };
let graphLayout = null;
let graphXform = { scale: 1, tx: 0, ty: 0 };

function applyView(v) {
  currentView = VIEWS.includes(v) ? v : 'list';
  localStorage.setItem('dashboard.viewType', currentView);
  document.querySelectorAll('.view-pane').forEach(p =>
    p.classList.toggle('active', p.id === currentView + 'Pane'));
  document.querySelectorAll('.view-opt').forEach(o => {
    const on = o.dataset.view === currentView;
    o.classList.toggle('active', on);
    const input = o.querySelector('input');
    if (input) input.checked = on;
  });
  if (currentView === 'graph') renderGraph();
  if (currentView === 'pages') ensurePages();
}
document.querySelectorAll('.view-opt input').forEach(r =>
  r.addEventListener('change', e => applyView(e.target.value)));

async function fetchGraph() {
  try {
    const r = await fetch(`${API}/graph`);
    graphData = await r.json();
  } catch (e) {
    graphData = { nodes: [], edges: [], initialized: false };
  }
}

function computeLayout(nodes) {
  const byDepth = new Map();
  nodes.forEach(n => {
    const d = (n.depth != null && Number.isFinite(+n.depth)) ? +n.depth : 0;
    if (!byDepth.has(d)) byDepth.set(d, []);
    byDepth.get(d).push(n);
  });
  const depths = [...byDepth.keys()].sort((a, b) => a - b);
  const LAYER_W = 230, NODE_H = 46, GAP_Y = 22, PAD = 40, PAD_X = 30;
  const positions = {};
  let maxColHeight = 0;
  depths.forEach(d => {
    const list = byDepth.get(d);
    const h = list.length * NODE_H + Math.max(0, list.length - 1) * GAP_Y;
    if (h > maxColHeight) maxColHeight = h;
  });
  const totalH = maxColHeight + PAD * 2;
  depths.forEach((d, i) => {
    const list = byDepth.get(d);
    const colH = list.length * NODE_H + Math.max(0, list.length - 1) * GAP_Y;
    let y = (totalH - colH) / 2;
    const x = PAD_X + i * LAYER_W;
    list.forEach(n => {
      const w = Math.min(196, Math.max(116, (n.title || n.id).length * 6.6 + 30));
      positions[n.id] = { x, y, w, h: NODE_H };
      y += NODE_H + GAP_Y;
    });
  });
  return { positions, width: PAD_X + depths.length * LAYER_W, height: totalH };
}

function renderGraph() {
  const root = document.getElementById('graphRoot');
  const svg = document.getElementById('graphSvg');
  const status = document.getElementById('graphStatus');
  const empty = document.getElementById('graphEmpty');
  if (!graphData.initialized || !graphData.nodes.length) {
    root.innerHTML = '';
    svg.removeAttribute('viewBox');
    empty.style.display = 'flex';
    status.textContent = graphData.initialized ? 'No graph data' : 'Beads not initialized';
    return;
  }
  empty.style.display = 'none';
  graphLayout = computeLayout(graphData.nodes);
  graphXform = { scale: 1, tx: 0, ty: 0 };
  drawGraph();
  status.textContent = `${graphData.nodes.length} nodes · ${graphData.edges.length} edges`;
}

function drawGraph() {
  if (!graphLayout) return;
  const root = document.getElementById('graphRoot');
  const svg = document.getElementById('graphSvg');
  svg.setAttribute('viewBox', `0 0 ${graphLayout.width} ${graphLayout.height}`);
  root.setAttribute('transform',
    `translate(${graphXform.tx},${graphXform.ty}) scale(${graphXform.scale})`);
  const pos = graphLayout.positions;
  let s = '<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2d3a4d"/></marker></defs>';
  for (const e of graphData.edges) {
    const a = pos[e.source], b = pos[e.target];
    if (!a || !b) continue;
    const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x, y2 = b.y + b.h / 2;
    const cx = (x1 + x2) / 2;
    s += `<path d="M${x1},${y1} C${cx},${y1} ${cx},${y2} ${x2},${y2}" fill="none" stroke="#2d3a4d" stroke-width="1.5" marker-end="url(#arrow)"/>`;
  }
  for (const n of graphData.nodes) {
    const p = pos[n.id];
    if (!p) continue;
    const color = STATUS_COLOR[n.ui_status] || '#8b949e';
    const id = esc(n.id);
    const title = esc(trunc(String(n.title || n.id || ''), p.w - 16));
    s += `<g class="gnode" data-id="${esc(n.id)}" style="cursor:pointer">`
      + `<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="6" fill="#1e293b" stroke="${color}" stroke-width="2"/>`
      + `<circle cx="${p.x + 11}" cy="${p.y + 13}" r="4" fill="${color}"/>`
      + `<text x="${p.x + 12}" y="${p.y + 22}" fill="#e6edf3" font-size="11" font-family="ui-monospace,monospace">${id}</text>`
      + `<text x="${p.x + 12}" y="${p.y + 38}" fill="#adbac7" font-size="11">${title}</text>`
      + `</g>`;
  }
  root.innerHTML = s;
  root.querySelectorAll('.gnode').forEach(g =>
    g.addEventListener('click', () => showBeadFromGraph(g.dataset.id)));
}

function trunc(str, maxPx) {
  const n = Math.max(5, Math.floor(maxPx / 6.5));
  return str.length > n ? str.slice(0, n - 1) + '…' : str;
}

function showBeadFromGraph(id) {
  window.open('/dashboard/bead/' + encodeURIComponent(id), '_blank');
}

function attachGraphInteraction() {
  const svg = document.getElementById('graphSvg');
  let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
  svg.addEventListener('mousedown', e => {
    if (e.target.closest('.gnode')) return;
    dragging = true; sx = e.clientX; sy = e.clientY; ox = graphXform.tx; oy = graphXform.ty;
  });
  window.addEventListener('mousemove', e => {
    if (!dragging || !graphLayout) return;
    const rect = svg.getBoundingClientRect();
    graphXform.tx = ox + (e.clientX - sx) * (graphLayout.width / rect.width);
    graphXform.ty = oy + (e.clientY - sy) * (graphLayout.height / rect.height);
    drawGraph();
  });
  window.addEventListener('mouseup', () => { dragging = false; });
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    graphXform.scale = Math.max(0.2, Math.min(4, graphXform.scale * (e.deltaY < 0 ? 1.1 : 0.9)));
    drawGraph();
  }, { passive: false });
}
document.getElementById('graphZoomIn').addEventListener('click', () => { graphXform.scale = Math.min(4, graphXform.scale * 1.2); drawGraph(); });
document.getElementById('graphZoomOut').addEventListener('click', () => { graphXform.scale = Math.max(0.2, graphXform.scale / 1.2); drawGraph(); });
document.getElementById('graphReset').addEventListener('click', () => { graphXform = { scale: 1, tx: 0, ty: 0 }; drawGraph(); });

(function renderGraphLegend() {
  const items = [['active', 'Active'], ['ready', 'Ready'], ['blocked', 'Blocked'], ['halted', 'Halted'], ['closed', 'Closed']];
  document.getElementById('graphLegend').innerHTML = items.map(([k, l]) =>
    `<span class="key"><span class="swatch" style="background:${STATUS_COLOR[k]}"></span>${l}</span>`).join('');
})();

// ── bvr Pages ───────────────────────────────────────────────────────────────
function ensurePages() {
  const frame = document.getElementById('pagesFrame');
  if (!frame.getAttribute('src')) frame.setAttribute('src', '/dashboard/pages/');
}
document.getElementById('pagesRegen').addEventListener('click', async () => {
  const st = document.getElementById('pagesStatus');
  const frame = document.getElementById('pagesFrame');
  st.textContent = 'regenerating…'; st.style.color = 'var(--muted)';
  try {
    const r = await fetch(`${API}/pages/refresh`, { method: 'POST' });
    const d = await r.json();
    if (d.ok) {
      st.textContent = 'regenerated'; st.style.color = 'var(--ok)';
      frame.setAttribute('src', '/dashboard/pages/?' + Date.now());
    } else if (d.initialized === false) {
      st.textContent = 'beads not initialized'; st.style.color = 'var(--err)';
    } else {
      st.textContent = 'failed: ' + (d.error || 'unknown'); st.style.color = 'var(--err)';
    }
  } catch (e) {
    st.textContent = 'request failed'; st.style.color = 'var(--err)';
  }
  setTimeout(() => { st.textContent = ''; }, 2500);
});

// ── Init ───────────────────────────────────────────────────────────────────
fetchEvents(); connectSSE();
updateRefreshUI();
scheduleRefresh();
startProgressBar();
attachGraphInteraction();
applyView(currentView);
</script>
