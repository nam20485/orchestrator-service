<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orchestration Dashboard</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --surface2: #1e293b;
      --border: #2d3a4d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #388bfd;
      --warn-bg: #3d2a00;
      --warn-border: #9e6a03;
      --warn-text: #f0c14b;
      --ok: #3fb950;
      --err: #f85149;
      --ready: #3fb950;
      --blocked: #f0c14b;
      --active: #388bfd;
      --closed: #6e7681;
      --halted: #f85149;
      --open: #e6edf3;
      --mono: ui-monospace, "Cascadia Code", "SF Mono", monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .topbar h1 { font-size: 1.2rem; margin: 0; }
    .topbar .right { display: flex; align-items: center; gap: 1rem; font-size: 0.85rem; color: var(--muted); }
    .loop-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      margin-right: 4px;
    }
    .loop-dot.running { background: var(--ok); animation: pulse 2s infinite; }
    .loop-dot.stopped { background: var(--err); }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }

    .summary {
      display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 0.75rem 1.25rem; min-width: 90px;
      text-align: center;
    }
    .stat-card .num { font-size: 1.6rem; font-weight: 700; line-height: 1.2; }
    .stat-card .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; }
    .stat-card.ready .num { color: var(--ready); }
    .stat-card.blocked .num { color: var(--blocked); }
    .stat-card.active .num { color: var(--active); }
    .stat-card.closed .num { color: var(--closed); }
    .stat-card.halted .num { color: var(--halted); }
    .stat-card.total .num { color: var(--text); }

    .grid { display: grid; gap: 1.5rem; grid-template-columns: 1fr 340px; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

    .panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; overflow: hidden;
    }
    .panel-header {
      padding: 0.6rem 1rem; border-bottom: 1px solid var(--border);
      font-size: 0.85rem; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.04em;
      display: flex; justify-content: space-between; align-items: center;
    }
    .panel-header .count {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 4px; padding: 0.1rem 0.5rem; font-size: 0.8rem; color: var(--text);
    }

    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    thead th {
      text-align: left; padding: 0.5rem 0.75rem; color: var(--muted);
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.03em;
      border-bottom: 1px solid var(--border); cursor: pointer; user-select: none;
      white-space: nowrap;
    }
    thead th:hover { color: var(--text); }
    thead th.sorted { color: var(--accent); }
    tbody tr { border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.1s; }
    tbody tr:hover { background: var(--surface2); }
    tbody tr.expanded { background: var(--surface2); }
    tbody td { padding: 0.5rem 0.75rem; vertical-align: top; }
    tbody tr.detail-row td { padding: 0; }
    .detail-content { padding: 0.75rem 1rem; background: var(--bg); border-top: 1px solid var(--border); }

    .badge {
      display: inline-block; padding: 0.15rem 0.55rem; border-radius: 4px;
      font-size: 0.72rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.03em; white-space: nowrap;
    }
    .badge.ready { background: rgba(63,185,80,0.15); color: var(--ready); }
    .badge.blocked { background: rgba(240,193,75,0.15); color: var(--blocked); }
    .badge.active { background: rgba(56,139,253,0.15); color: var(--active); animation: pulse 2s infinite; }
    .badge.closed { background: rgba(110,118,129,0.15); color: var(--closed); }
    .badge.halted { background: rgba(248,81,73,0.15); color: var(--halted); }
    .badge.open { background: rgba(230,237,243,0.1); color: var(--open); }

    .id-cell { font-family: var(--mono); font-size: 0.82rem; }
    .empty-msg { padding: 2rem 1rem; text-align: center; color: var(--muted); font-size: 0.9rem; }

    .active-list { list-style: none; margin: 0; padding: 0; }
    .active-item {
      padding: 0.6rem 1rem; border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
    }
    .active-item:last-child { border-bottom: none; }
    .active-item .title { font-weight: 600; margin-bottom: 0.15rem; }
    .active-item .meta { color: var(--muted); font-size: 0.78rem; display: flex; gap: 0.75rem; }
    .active-item .elapsed { color: var(--accent); font-family: var(--mono); }

    .timeline { max-height: 400px; overflow-y: auto; }
    .event-item {
      padding: 0.45rem 1rem; border-bottom: 1px solid var(--border);
      font-size: 0.8rem; display: flex; gap: 0.5rem; align-items: baseline;
    }
    .event-item:last-child { border-bottom: none; }
    .event-time { color: var(--muted); font-family: var(--mono); font-size: 0.72rem; white-space: nowrap; min-width: 60px; }
    .event-type {
      font-size: 0.7rem; font-weight: 600; padding: 0.1rem 0.4rem;
      border-radius: 3px; text-transform: uppercase; white-space: nowrap;
    }
    .event-type.bead { background: rgba(56,139,253,0.15); color: var(--accent); }
    .event-type.agent { background: rgba(56,139,253,0.15); color: var(--accent); }
    .event-type.webhook { background: rgba(63,185,80,0.15); color: var(--ok); }
    .event-type.dispatch { background: rgba(63,185,80,0.15); color: var(--ok); }
    .event-type.bead_failed { background: rgba(248,81,73,0.15); color: var(--err); }
    .event-type.bead_halted { background: rgba(248,81,73,0.15); color: var(--err); }
    .event-detail { color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .log-tabs { display: flex; gap: 0; margin-bottom: 0.5rem; }
    .log-tab {
      padding: 0.35rem 0.9rem; background: var(--surface); border: 1px solid var(--border);
      border-bottom: none; border-radius: 4px 4px 0 0; cursor: pointer; font-size: 0.8rem;
      color: var(--muted);
    }
    .log-tab.active { color: var(--text); border-color: var(--accent); }
    .log-box {
      background: #0d1117; border: 1px solid var(--border); border-radius: 0 4px 4px 4px;
      padding: 0.75rem; font-family: var(--mono); font-size: 0.78rem;
      max-height: 320px; overflow-y: auto; white-space: pre-wrap; word-break: break-all;
      color: #adbac7;
    }
    .log-box.empty { color: var(--muted); }
    .log-actions { display: flex; justify-content: flex-end; margin-top: 0.5rem; }
    button {
      background: var(--accent); color: #fff; border: none; border-radius: 4px;
      padding: 0.3rem 0.75rem; font-size: 0.8rem; cursor: pointer;
    }
    button:hover { filter: brightness(1.1); }
    button.secondary { background: var(--surface2); border: 1px solid var(--border); }
    .refresh-on { font-size: 0.72rem; color: var(--ok); }

    .sse-status { font-size: 0.72rem; }
    .sse-status.connected { color: var(--ok); }
    .sse-status.disconnected { color: var(--err); }
  </style>
</head>
<body>

<div class="topbar">
  <h1>Orchestration Dashboard</h1>
  <div class="right">
    <span><span id="loopDot" class="loop-dot stopped"></span><span id="loopText">Loop: stopped</span></span>
    <span id="sseStatus" class="sse-status disconnected">SSE: disconnected</span>
    <span id="clock"></span>
  </div>
</div>

<div class="container">
  <!-- Summary cards -->
  <div class="summary" id="summaryCards"></div>

  <div class="grid">
    <!-- Left column: bead table -->
    <div>
      <div class="panel">
        <div class="panel-header">
          <span>Beads</span>
          <span class="count" id="beadCount">0</span>
        </div>
        <table id="beadTable">
          <thead>
            <tr>
              <th data-col="ui_status">Status</th>
              <th data-col="id">ID</th>
              <th data-col="title">Title</th>
              <th data-col="type">Type</th>
              <th data-col="priority">Pri</th>
              <th data-col="retry_count">Retries</th>
              <th data-col="elapsed_s">Elapsed</th>
            </tr>
          </thead>
          <tbody id="beadBody"></tbody>
        </table>
      </div>
    </div>

    <!-- Right column: active agents + event timeline -->
    <div style="display: flex; flex-direction: column; gap: 1.5rem;">
      <div class="panel">
        <div class="panel-header">
          <span>Active Agents</span>
          <span class="count" id="activeCount">0</span>
        </div>
        <ul class="active-list" id="activeList"></ul>
      </div>

      <div class="panel">
        <div class="panel-header">
          <span>Event Timeline</span>
          <span class="count" id="eventCount">0</span>
        </div>
        <div class="timeline" id="timeline"></div>
      </div>
    </div>
  </div>
</div>

<script>
const API = '/api/dashboard';
let beadData = [];
let sortCol = 'ui_status';
let sortAsc = true;
let expandedBead = null;
let eventBuffer = [];
const MAX_EVENTS = 200;

// ── Clock ──────────────────────────────────────────────────────────────────
function tick() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString();
}
setInterval(tick, 1000); tick();

// ── Overview ───────────────────────────────────────────────────────────────
async function fetchOverview() {
  try {
    const r = await fetch(`${API}/overview`);
    const d = await r.json();
    const c = d.counts;
    const cards = [
      ['total',   'Total',   c.total],
      ['ready',   'Ready',   c.ready],
      ['blocked', 'Blocked', c.blocked],
      ['active',  'Active',  c.active],
      ['closed',  'Closed',  c.closed],
      ['halted',  'Halted',  c.halted],
    ];
    document.getElementById('summaryCards').innerHTML = cards.map(([cls, label, num]) =>
      `<div class="stat-card ${cls}"><div class="num">${num}</div><div class="label">${label}</div></div>`
    ).join('');

    const running = d.loop_status.running;
    const dot = document.getElementById('loopDot');
    dot.className = 'loop-dot ' + (running ? 'running' : 'stopped');
    document.getElementById('loopText').textContent =
      `Loop: ${running ? 'running' : 'stopped'} (${d.loop_status.poll_interval}s)`;
  } catch (e) { /* ignore transient fetch errors */ }
}

// ── Beads table ────────────────────────────────────────────────────────────
async function fetchBeads() {
  try {
    const r = await fetch(`${API}/beads`);
    beadData = await r.json();
    document.getElementById('beadCount').textContent = beadData.length;
    renderBeads();
  } catch (e) { /* ignore */ }
}

function renderBeads() {
  const tbody = document.getElementById('beadBody');
  if (!beadData.length) {
    tbody.innerHTML = '<tr><td colspan="7"><div class="empty-msg">No beads found. Run /plan-to-beads to create the DAG.</div></td></tr>';
    return;
  }

  // Sort
  beadData.sort((a, b) => {
    let va = a[sortCol], vb = b[sortCol];
    if (va == null) va = '';
    if (vb == null) vb = '';
    if (typeof va === 'number' && typeof vb === 'number') return sortAsc ? va - vb : vb - va;
    return sortAsc ? String(va).localeCompare(String(vb)) : String(vb).localeCompare(String(va));
  });

  let html = '';
  for (const b of beadData) {
    const expanded = expandedBead === b.id;
    html += `<tr class="${expanded ? 'expanded' : ''}" onclick="toggleBead('${b.id}')">`;
    html += `<td><span class="badge ${b.ui_status}">${b.ui_status}</span></td>`;
    html += `<td class="id-cell">${b.id}</td>`;
    html += `<td>${esc(b.title)}</td>`;
    html += `<td>${b.type || ''}</td>`;
    html += `<td>${b.priority}</td>`;
    html += `<td>${b.retry_count > 0 ? b.retry_count : ''}</td>`;
    html += `<td>${b.elapsed_s != null ? b.elapsed_s + 's' : ''}</td>`;
    html += '</tr>';

    if (expanded) {
      html += `<tr class="detail-row"><td colspan="7"><div class="detail-content" id="detail-${b.id}">Loading...</div></td></tr>`;
    }
  }
  tbody.innerHTML = html;

  // Update sort indicators
  document.querySelectorAll('thead th').forEach(th => {
    th.classList.toggle('sorted', th.dataset.col === sortCol);
  });

  // Load detail if expanded
  if (expandedBead) loadBeadDetail(expandedBead);
}

async function loadBeadDetail(beadId) {
  const el = document.getElementById('detail-' + beadId);
  if (!el) return;
  const bead = beadData.find(b => b.id === beadId);
  let html = `<div style="margin-bottom:0.5rem;font-size:0.8rem;color:var(--muted);">${esc(bead.description || 'No description.')}</div>`;
  html += `<div class="log-tabs"><div class="log-tab active" onclick="switchLog('${beadId}', 'stdout')">stdout</div><div class="log-tab" onclick="switchLog('${beadId}', 'stderr')">stderr</div></div>`;
  html += `<div class="log-box" id="logbox-${beadId}">Loading logs...</div>`;
  html += `<div class="log-actions"><button class="secondary" onclick="loadBeadLog('${beadId}')">Refresh</button></div>`;
  el.innerHTML = html;
  loadBeadLog(beadId);
}

let currentLogTab = {};
async function loadBeadLog(beadId) {
  try {
    const r = await fetch(`${API}/beads/${encodeURIComponent(beadId)}/logs?tail=200`);
    const d = await r.json();
    const tab = currentLogTab[beadId] || 'stdout';
    const box = document.getElementById('logbox-' + beadId);
    if (!box) return;
    const content = tab === 'stdout' ? d.stdout : d.stderr;
    box.textContent = content || '(empty)';
    box.className = 'log-box' + (content ? '' : ' empty');
  } catch (e) {
    const box = document.getElementById('logbox-' + beadId);
    if (box) { box.textContent = 'Failed to load logs.'; box.className = 'log-box empty'; }
  }
}

function switchLog(beadId, tab) {
  currentLogTab[beadId] = tab;
  document.querySelectorAll(`#detail-${beadId} .log-tab`).forEach(el => {
    el.classList.toggle('active', el.textContent === tab);
  });
  loadBeadLog(beadId);
}

function toggleBead(id) {
  expandedBead = expandedBead === id ? null : id;
  renderBeads();
}

// ── Active agents ──────────────────────────────────────────────────────────
async function fetchActive() {
  try {
    const r = await fetch(`${API}/active`);
    const list = await r.json();
    document.getElementById('activeCount').textContent = list.length;
    const el = document.getElementById('activeList');
    if (!list.length) {
      el.innerHTML = '<li class="active-item" style="color:var(--muted)">No active agents.</li>';
      return;
    }
    el.innerHTML = list.map(a => `
      <li class="active-item">
        <div class="title">${esc(a.title)} <span class="id-cell" style="color:var(--muted)">(${esc(a.bead_id)})</span></div>
        <div class="meta">
          <span>attempt ${a.retry_count + 1}</span>
          ${a.elapsed_s != null ? `<span class="elapsed">${a.elapsed_s}s</span>` : ''}
        </div>
      </li>
    `).join('');
  } catch (e) { /* ignore */ }
}

// ── Events ─────────────────────────────────────────────────────────────────
async function fetchEvents() {
  try {
    const r = await fetch(`${API}/events?limit=50`);
    const events = await r.json();
    eventBuffer = events.reverse();
    renderEvents();
  } catch (e) { /* ignore */ }
}

function renderEvents() {
  const el = document.getElementById('timeline');
  document.getElementById('eventCount').textContent = eventBuffer.length;
  if (!eventBuffer.length) {
    el.innerHTML = '<div class="empty-msg">No events yet.</div>';
    return;
  }
  el.innerHTML = eventBuffer.slice(0, 100).map(formatEvent).join('');
}

function formatEvent(e) {
  const t = new Date(e.ts * 1000).toLocaleTimeString();
  const d = e.data || {};
  let detail = '';
  switch (e.type) {
    case 'bead_picked_up': detail = `${d.bead_id}: ${d.title || ''}`; break;
    case 'agent_spawned':  detail = `${d.bead_id} pid=${d.pid} attempt=${d.attempt}`; break;
    case 'agent_completed':detail = `${d.bead_id} exit=${d.exit_code} ${d.duration_s}s status=${d.status}`; break;
    case 'bead_closed':    detail = `${d.bead_id}`; break;
    case 'bead_failed':    detail = `${d.bead_id} attempt=${d.attempt}/${d.max_retries}`; break;
    case 'bead_halted':    detail = `${d.bead_id} (${d.reason})`; break;
    case 'webhook_received':detail = `${d.event}/${d.action || ''} → ${d.repo}`; break;
    case 'dispatch_started': detail = `${d.prompt_file} pid=${d.pid}`; break;
    case 'dispatch_completed': detail = `${d.prompt_file} exit=${d.exit_code}`; break;
    default: detail = JSON.stringify(d).slice(0, 80);
  }
  const cls = e.type.replace(/_/g, ' ').split(' ')[0];
  return `<div class="event-item">
    <span class="event-time">${t}</span>
    <span class="event-type ${e.type}">${e.type.replace(/_/g, ' ')}</span>
    <span class="event-detail">${esc(detail)}</span>
  </div>`;
}

function addEvent(e) {
  eventBuffer.unshift(e);
  if (eventBuffer.length > MAX_EVENTS) eventBuffer.pop();
  renderEvents();
}

// ── SSE ────────────────────────────────────────────────────────────────────
let evtSource = null;
function connectSSE() {
  if (evtSource) evtSource.close();
  evtSource = new EventSource(`${API}/events/stream`);
  const statusEl = document.getElementById('sseStatus');
  evtSource.onopen = () => { statusEl.textContent = 'SSE: connected'; statusEl.className = 'sse-status connected'; };
  evtSource.onerror = () => {
    statusEl.textContent = 'SSE: disconnected';
    statusEl.className = 'sse-status disconnected';
    evtSource.close();
    setTimeout(connectSSE, 3000);
  };
  evtSource.onmessage = (msg) => {
    try {
      const e = JSON.parse(msg.data);
      addEvent(e);
      // Refresh relevant panels on state-changing events
      if (['bead_picked_up', 'bead_closed', 'bead_failed', 'bead_halted', 'agent_completed'].includes(e.type)) {
        fetchOverview(); fetchBeads(); fetchActive();
      }
    } catch (err) { /* ignore parse errors on keepalive */ }
  };
}

// ── Helpers ────────────────────────────────────────────────────────────────
function esc(s) {
  const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML;
}

// ── Sorting ────────────────────────────────────────────────────────────────
document.querySelectorAll('thead th').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (sortCol === col) sortAsc = !sortAsc;
    else { sortCol = col; sortAsc = true; }
    renderBeads();
  });
});

// ── Init ───────────────────────────────────────────────────────────────────
fetchOverview(); fetchBeads(); fetchActive(); fetchEvents(); connectSSE();
setInterval(fetchOverview, 10000);
setInterval(fetchBeads, 10000);
setInterval(fetchActive, 5000);
</script>

</body>
</html>
